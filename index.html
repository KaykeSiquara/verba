<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Verba · Finance operations for nonprofits</title>
    <meta name="description" content="Verba is a finance operations dashboard for nonprofits: documents, approvals, programs and team in one accessible app, in English and Portuguese. Built with React 19, TypeScript, Tailwind CSS v4 and Radix UI." />
    <meta name="author" content="Kayke Siquara Mendonça" />
    <meta name="theme-color" content="#f6f7f9" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#14161c" media="(prefers-color-scheme: dark)" />

    <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Verba" />
    <meta property="og:title" content="Verba · Finance operations for nonprofits" />
    <meta property="og:description" content="Documents, approvals, programs and team in one accessible dashboard. Open the live demo, no sign-up needed." />
    <meta property="og:url" content="https://kayke-siquara-verba.vercel.app/" />

    <script>
      (function () {
        try {
          var p = JSON.parse(localStorage.getItem("verba:prefs") || "{}");
          var dark = p.theme === "dark" || ((!p.theme || p.theme === "system") && matchMedia("(prefers-color-scheme: dark)").matches);
          if (dark) document.documentElement.classList.add("dark");
          if (p.lang) document.documentElement.lang = p.lang;
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
