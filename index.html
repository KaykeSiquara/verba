<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Verba: finance operations for nonprofits. Documents, programs, approvals and team in one dashboard." />
    <meta name="theme-color" content="#f6f7f9" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>Verba</title>
    <script>
      (function () {
        try {
          var p = JSON.parse(localStorage.getItem("verba:prefs") || "{}");
          var dark = p.theme === "dark" || ((!p.theme || p.theme === "system") && matchMedia("(prefers-color-scheme: dark)").matches);
          if (dark) document.documentElement.classList.add("dark");
          if (p.lang) document.documentElement.lang = p.lang;
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
